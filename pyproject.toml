[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "control-eval-lab"
version = "0.1.0"
description = "Control evaluation harness for agentic attackers against a disposable local toy app"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Control Eval Lab contributors" }]
dependencies = [
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.0.0",
  "openai>=1.60.0",
  "openai-agents>=0.2.0",
  "mcp>=1.19.0,<2",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
browser = ["playwright>=1.49.0"]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[project.scripts]
control-eval = "control_eval.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"
